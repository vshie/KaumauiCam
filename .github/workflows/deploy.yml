name: Deploy BlueOS Extension Image

# The boat BlueOS host is linux/arm/v7 (Raspberry Pi). Do not use
# BlueOS-community/Deploy-BlueOS-Extension — it always QEMU-cross-builds
# linux/arm64 as well, and QEMU routinely segfaults in libc-bin's
# postinst (dpkg 139 / apt 100). We publish amd64 + arm/v7 only.

on:
  push:

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image tags
        id: meta
        run: |
          DOCKER_IMAGE="${{ secrets.DOCKER_USERNAME }}/blueos-kaumaui_cam"
          VERSION="${GITHUB_REF##*/}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest"
          fi
          echo "docker_image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 + linux/arm/v7
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_NAME=kaumaui_cam
            AUTHOR=${{ vars.MY_NAME }}
            AUTHOR_EMAIL=${{ vars.MY_EMAIL }}
            MAINTAINER=${{ vars.ORG_NAME }}
            MAINTAINER_EMAIL=${{ vars.ORG_EMAIL }}
            REPO=${{ github.repository }}
            OWNER=${{ github.repository_owner }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.docker_image }}:${{ steps.meta.outputs.version }}"
